<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Facts</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="data/animals.js"></script>
  <script src="js/app.js"></script>
</head>
<body>

<!-- Back-to-hub banner -->
<a href="https://mrssteynsgames.netlify.app" style="
  display:flex;align-items:center;gap:0.5rem;
  background:#1e293b;color:#f8fafc;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:0.82rem;font-weight:600;
  padding:0.55rem 1.2rem;
  text-decoration:none;letter-spacing:0.01em;
">← All Games</a>

<header class="site-header" id="site-header"></header>

<main class="main-content">
  <a class="back-link" id="back-link" href="index.html">← Back</a>
  <div id="card-container"></div>
  <nav class="nav-arrows" id="nav-arrows"></nav>
</main>

<script>
  google.charts.load('current', { packages: ['geochart'] });
  google.charts.setOnLoadCallback(onGoogleChartsReady);

  const habitat  = getQueryParam('h') || 'Rainforest';
  const idx      = parseInt(getQueryParam('i') || '0', 10);
  const animals  = getAnimalsByHabitat(habitat);
  const total    = animals.length;
  const animal   = animals[idx] || animals[0];

  document.title = `${animal.name} – Animal Facts`;

  buildHeader(habitat);

  document.getElementById('back-link').href = `habitat.html?h=${encodeURIComponent(habitat)}`;
  document.getElementById('back-link').textContent = `← Back to ${habitat}`;

  renderCard(animal, 'card-container');

  // Prev / next navigation within the same habitat
  const prevIdx    = (idx - 1 + total) % total;
  const nextIdx    = (idx + 1) % total;
  const prevAnimal = animals[prevIdx];
  const nextAnimal = animals[nextIdx];

  document.getElementById('nav-arrows').innerHTML = `
    <a class="nav-btn" href="animal.html?h=${encodeURIComponent(habitat)}&i=${prevIdx}">
      <span class="arrow">←</span>
      <span class="nav-name">${prevAnimal.emoji} ${prevAnimal.name}</span>
    </a>
    <a class="nav-btn" href="animal.html?h=${encodeURIComponent(habitat)}&i=${nextIdx}">
      <span class="nav-name">${nextAnimal.emoji} ${nextAnimal.name}</span>
      <span class="arrow">→</span>
    </a>
  `;
</script>
</body>
</html>
